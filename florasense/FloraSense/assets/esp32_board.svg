<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14191c" />
      <stop offset="100%" stop-color="#0a0d0e" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="100%" stop-color="#9ca3af" />
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ESP32 PCB Board -->
  <rect x="25" y="15" width="150" height="90" rx="6" fill="url(#pcb)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Pins Row (15 pins) -->
  <g fill="url(#goldPin)">
    <rect x="35" y="10" width="4" height="8" rx="1" />
    <rect x="43" y="10" width="4" height="8" rx="1" />
    <rect x="51" y="10" width="4" height="8" rx="1" />
    <rect x="59" y="10" width="4" height="8" rx="1" />
    <rect x="67" y="10" width="4" height="8" rx="1" />
    <rect x="75" y="10" width="4" height="8" rx="1" />
    <rect x="83" y="10" width="4" height="8" rx="1" />
    <rect x="91" y="10" width="4" height="8" rx="1" />
    <rect x="99" y="10" width="4" height="8" rx="1" />
    <rect x="107" y="10" width="4" height="8" rx="1" />
    <rect x="115" y="10" width="4" height="8" rx="1" />
    <rect x="123" y="10" width="4" height="8" rx="1" />
    <rect x="131" y="10" width="4" height="8" rx="1" />
    <rect x="139" y="10" width="4" height="8" rx="1" />
    <rect x="147" y="10" width="4" height="8" rx="1" />
    <rect x="155" y="10" width="4" height="8" rx="1" />
  </g>

  <!-- Bottom Pins Row (15 pins) -->
  <g fill="url(#goldPin)">
    <rect x="35" y="102" width="4" height="8" rx="1" />
    <rect x="43" y="102" width="4" height="8" rx="1" />
    <rect x="51" y="102" width="4" height="8" rx="1" />
    <rect x="59" y="102" width="4" height="8" rx="1" />
    <rect x="67" y="102" width="4" height="8" rx="1" />
    <rect x="75" y="102" width="4" height="8" rx="1" />
    <rect x="83" y="102" width="4" height="8" rx="1" />
    <rect x="91" y="102" width="4" height="8" rx="1" />
    <rect x="99" y="102" width="4" height="8" rx="1" />
    <rect x="107" y="102" width="4" height="8" rx="1" />
    <rect x="115" y="102" width="4" height="8" rx="1" />
    <rect x="123" y="102" width="4" height="8" rx="1" />
    <rect x="131" y="102" width="4" height="8" rx="1" />
    <rect x="139" y="102" width="4" height="8" rx="1" />
    <rect x="147" y="102" width="4" height="8" rx="1" />
    <rect x="155" y="102" width="4" height="8" rx="1" />
  </g>

  <!-- Micro USB Port -->
  <rect x="15" y="47" width="16" height="26" rx="2" fill="#9ca3af" stroke="#4b5563" />
  <rect x="17" y="52" width="10" height="16" rx="1" fill="#1f2937" />

  <!-- ESP-WROOM-32 Metal RF Shield -->
  <rect x="80" y="32" width="75" height="56" rx="3" fill="url(#shield)" stroke="#6b7280" />
  <text x="117" y="55" font-family="monospace" font-size="8" font-weight="bold" fill="#1f2937" text-anchor="middle">ESP-WROOM-32</text>
  <text x="117" y="67" font-family="sans-serif" font-size="6" fill="#374151" text-anchor="middle">WiFi + BT SoC</text>

  <!-- Wi-Fi PCB Trace Antenna on left of module -->
  <rect x="155" y="36" width="14" height="48" rx="1" fill="#1f2937" />
  <path d="M 158 40 L 166 40 L 166 44 L 160 44 L 160 48 L 166 48 L 166 52 L 160 52 L 160 56 L 166 56 L 166 60 L 160 60 L 160 64 L 166 64 L 166 68 L 160 68 L 160 72 L 166 72 L 166 76 L 158 76" stroke="#fbbf24" stroke-width="1.2" fill="none" />

  <!-- Onboard LEDs -->
  <circle cx="45" cy="40" r="2.5" fill="#ef4444" filter="url(#glow)" />
  <text x="45" y="48" font-family="monospace" font-size="5" fill="#9ca3af" text-anchor="middle">PWR</text>
  <circle cx="45" cy="75" r="2.5" fill="#3b82f6" filter="url(#glow)" />
  <text x="45" y="83" font-family="monospace" font-size="5" fill="#9ca3af" text-anchor="middle">IO2</text>

  <!-- Tactile Buttons (EN & BOOT) -->
  <rect x="36" y="24" width="7" height="9" rx="1" fill="#4b5563" />
  <circle cx="39.5" cy="28.5" r="2" fill="#d1d5db" />
  <text x="40" y="21" font-family="monospace" font-size="5" fill="#9ca3af" text-anchor="middle">EN</text>

  <rect x="36" y="87" width="7" height="9" rx="1" fill="#4b5563" />
  <circle cx="39.5" cy="91.5" r="2" fill="#d1d5db" />
  <text x="40" y="103" font-family="monospace" font-size="5" fill="#9ca3af" text-anchor="middle">BOOT</text>

  <!-- Voltage Regulator IC -->
  <rect x="60" y="50" width="12" height="18" rx="1" fill="#111827" stroke="#374151" />
  <text x="66" y="62" font-family="monospace" font-size="5" fill="#6b7280" text-anchor="middle">AMS1117</text>

  <!-- Circuit traces -->
  <path d="M 50 40 L 60 40 L 60 50" stroke="#22c55e" stroke-width="0.8" fill="none" opacity="0.6" />
  <path d="M 50 75 L 60 75 L 60 68" stroke="#22c55e" stroke-width="0.8" fill="none" opacity="0.6" />
</svg>
